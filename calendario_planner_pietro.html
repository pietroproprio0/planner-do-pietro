      const list=eventos.filter(e=>e.date===ds && visible(e));
      list.slice(0,3).forEach(e=>{
        const div=document.createElement("div"); div.className="event "+e.type;
        div.textContent=e.subject+" — "+e.title; cell.appendChild(div);
      });
      if(list.length>3){ const more=document.createElement("div"); more.className="more"; more.textContent="+"+(list.length-3)+" eventos"; cell.appendChild(more); }
    } else cell.innerHTML='<div class="num">'+(day<1?new Date(y,m,day).getDate():day)+'</div>';
    grid.appendChild(cell);
  }
}
function openDay(ds){
  const list=eventos.filter(e=>e.date===ds && visible(e));
  const c=document.getElementById("content");
  c.innerHTML='<div class="date-title">📅 '+fmt(ds)+'</div>';
  if(!list.length){ c.innerHTML+='<div class="empty">Não há eventos cadastrados para este dia.</div>'; }
  list.forEach(e=>{
    const item=document.createElement("div"); item.className="item";
    item.innerHTML='<h3>'+typeNames[e.type]+' · '+e.subject+'</h3>'+
      '<div class="meta"><span class="pill">'+e.title+'</span>'+
      (e.points?'<span class="pill">Nota: '+e.points+'</span>':'')+
      '<span class="pill">'+fmt(e.date)+'</span></div>'+
      '<div class="todo"><b>O que fazer:</b><br>'+e.todo+'</div>';
    c.appendChild(item);
  });
  document.getElementById("modal").classList.add("show");
}
document.getElementById("prev").onclick=()=>{current.setMonth(current.getMonth()-1);render()};
document.getElementById("next").onclick=()=>{current.setMonth(current.getMonth()+1);render()};
document.getElementById("today").onclick=()=>{current=new Date();current.setDate(1);render()};
document.getElementById("close").onclick=()=>document.getElementById("modal").classList.remove("show");
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")e.currentTarget.classList.remove("show")};
document.getElementById("search").oninput=e=>{query=e.target.value;render()};
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); filter=b.dataset.filter; render();
});
render();
</script>
</body>
</html>
